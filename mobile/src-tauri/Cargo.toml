[package]
name = "kanva-mobile"
version = "0.1.0"
edition = "2021"
description = "Kanva - Kanban Board Management (Mobile)"

[lib]
name = "kanva_mobile_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
