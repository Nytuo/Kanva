[package]
name = "kanva-desktop"
version = "0.1.0"
edition = "2021"
description = "Kanva - Kanban Board Management (Desktop)"

[lib]
name = "kanva_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portpicker = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Embed the server as a library (no Redis in standalone mode)
kanva-server = { path = "../../server", default-features = false }
