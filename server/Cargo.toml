[package]
name = "kanva-server"
version = "0.1.0"
edition = "2021"
authors = ["Kanva Team"]
description = "Kanva - Kanban board management server"

[lib]
name = "kanva_server"
path = "src/lib.rs"

[[bin]]
name = "kanva-server"
path = "src/main.rs"

[features]
default = ["redis-support"]
redis-support = ["redis"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip", "limit"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "any", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# Redis (optional — not used in standalone/embedded mode)
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"

# OAuth2
oauth2 = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Decimal
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
validator = { version = "0.18", features = ["derive"] }
tokio-tungstenite = "0.21"
futures = "0.3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
