name: build

# Builds every shippable artifact for Kanva:
#   - desktop   Tauri app installers (linux x64/arm64, macOS aarch64, windows x64/arm64)
#   - server    standalone `kanva-server` binaries (same 5 targets)
#   - web       static SPA build (platform-independent)
#   - docker    server + web images, multi-arch (linux/amd64, linux/arm64) pushed to GHCR
#   - mobile    Android APK/AAB, best-effort iOS simulator build
#
# Desktop releases are signed with the Tauri updater key (see TAURI_SIGNING_PRIVATE_KEY*
# secrets below) — required for the in-app auto-updater (UpdaterModal) to trust them.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Desktop/server platform to build (choose a single target or "all")'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - macos-aarch64
          - ubuntu
          - ubuntu-arm
          - windows
          - windows-arm64

jobs:
  # ============================================================
  # Shared platform matrix for the desktop + server jobs
  # ============================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          ALL='[
            {"id":"macos-aarch64","runs_on":"macos-latest","target":"aarch64-apple-darwin"},
            {"id":"ubuntu","runs_on":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
            {"id":"ubuntu-arm","runs_on":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"id":"windows","runs_on":"windows-2022","target":"x86_64-pc-windows-msvc"},
            {"id":"windows-arm64","runs_on":"windows-11-arm","target":"aarch64-pc-windows-msvc"}
          ]'
          PLATFORM="${{ github.event.inputs.platform }}"
          if [[ -z "$PLATFORM" || "$PLATFORM" == "all" ]]; then
            INCLUDE="$ALL"
          else
            INCLUDE=$(echo "$ALL" | jq "[.[] | select(.id == \"$PLATFORM\")]")
          fi
          echo "matrix=$(echo "$INCLUDE" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Desktop app (Tauri) — installers + signed updater artifacts
  # ============================================================
  desktop:
    needs: setup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies (ubuntu only)
        if: startsWith(matrix.runs_on, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: install web dependencies
        working-directory: web
        run: npm ci

      - name: install desktop (tauri-cli) dependencies
        working-directory: desktop
        run: npm install

      - name: build desktop app
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kanva-desktop-${{ matrix.id }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/

  # ============================================================
  # Standalone server binary — for self-hosters who don't want Docker
  # ============================================================
  server:
    needs: setup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'server -> target'

      - name: build kanva-server
        working-directory: server
        run: cargo build --release --locked --target ${{ matrix.target }} --bin kanva-server

      - name: package binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp server/target/${{ matrix.target }}/release/kanva-server dist/
          tar -C dist -czf kanva-server-${{ matrix.target }}.tar.gz kanva-server

      - name: package binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "server/target/${{ matrix.target }}/release/kanva-server.exe" dist/
          Compress-Archive -Path dist/kanva-server.exe -DestinationPath kanva-server-${{ matrix.target }}.zip

      - name: upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kanva-server-${{ matrix.id }}
          path: |
            kanva-server-${{ matrix.target }}.tar.gz
            kanva-server-${{ matrix.target }}.zip

  # ============================================================
  # Web SPA — single, platform-independent build
  # ============================================================
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install dependencies
        working-directory: web
        run: npm ci

      - name: typecheck + build
        working-directory: web
        run: npm run build

      - name: upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanva-web-dist
          path: web/dist

  # ============================================================
  # Docker images — multi-arch (linux/amd64, linux/arm64), pushed to GHCR
  # ============================================================
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: set repo owner (lowercase)
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/kanva-server:latest
            ghcr.io/${{ env.REPO_OWNER }}/kanva-server:${{ github.sha }}
          cache-from: type=gha,scope=kanva-server
          cache-to: type=gha,mode=max,scope=kanva-server

      - name: build & push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/kanva-web:latest
            ghcr.io/${{ env.REPO_OWNER }}/kanva-web:${{ github.sha }}
          cache-from: type=gha,scope=kanva-web
          cache-to: type=gha,mode=max,scope=kanva-web

  # ============================================================
  # Mobile — Android (real build) + iOS (best-effort, unsigned)
  # ============================================================
  mobile-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'mobile/src-tauri -> target'

      - name: install web dependencies
        working-directory: web
        run: npm ci

      - name: install mobile (tauri-cli) dependencies
        working-directory: mobile
        run: npm install

      - name: NDK env
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # Scaffold the Android Gradle project so the signing step below has
      # somewhere to write keystore.properties before the real build runs.
      - name: init Android project
        working-directory: mobile
        run: npx tauri android init

      # A signed release build needs a keystore — decode one from repo secrets
      # if configured. Without it, this produces a debug-signed APK/AAB that's
      # fine for CI validation but not for the Play Store.
      - name: configure release signing (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/src-tauri/gen/android/keystore.jks
          cat >> mobile/src-tauri/gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=keystore.jks
          EOF

      - name: build Android app
        working-directory: mobile
        run: npm run android

      - name: upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: kanva-android
          path: |
            mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  mobile-ios:
    runs-on: macos-latest
    continue-on-error: true # unsigned build — informational until Apple signing secrets exist
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'mobile/src-tauri -> target'

      - name: install web dependencies
        working-directory: web
        run: npm ci

      - name: install mobile (tauri-cli) dependencies
        working-directory: mobile
        run: npm install

      # Real device/App Store builds need an Apple Developer certificate +
      # provisioning profile (APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID secrets). Without them we
      # only build for the simulator, which needs no signing — good enough to
      # catch compile breakage in CI, not to publish an IPA.
      - name: build iOS app (simulator, unsigned)
        working-directory: mobile
        run: npm run ios -- --target aarch64-sim

  # ============================================================
  # Unified Release — all artifacts in one release
  # ============================================================
  release:
    needs: [desktop, server, web, mobile-android, mobile-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' server/Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'Kanva v${{ steps.version.outputs.version }}'
          draft: true
          files: artifacts/**/*
