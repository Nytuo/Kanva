name: release

# Manual only. Nothing in this file triggers on push, merge or tag — you
# dispatch it from the Actions tab (and pick the branch there).
#
#   1. version  — derive the next semver from the conventional commits since
#                 the last v* tag, or take the explicit override input.
#   2. build    — build every platform with that version patched into the
#                 manifests. The patch happens in the runner workspace only;
#                 nothing is ever committed or pushed back to the repo.
#   3. release  — a DRAFT GitHub release tagged v<version>, changelog as the
#                 body, artifacts attached. The git tag is created by GitHub
#                 when you publish the draft, so dispatching this is always
#                 reversible: delete the draft and nothing remains.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump — 'auto' derives it from conventional commits"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: 'Explicit version, e.g. 1.4.0 (overrides "bump")'
        type: string
        required: false
      platform:
        description: 'Platform to build'
        type: choice
        default: all
        options:
          - all
          - macos-aarch64
          - ubuntu
          - ubuntu-arm
          - windows
          - windows-arm64
      prerelease:
        description: 'Mark the release as a prerelease'
        type: boolean
        default: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      previous_tag: ${{ steps.semver.outputs.previous_tag }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and changelog
        id: semver
        shell: bash
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          D="$RUNNER_TEMP/changelog"
          mkdir -p "$D"

          # Baseline = the most recently created release tag, accepting every
          # scheme this repo has used (1.2.3, v1.2.3, app-v1.2.3) so a rename
          # never makes the next version go backwards. Sorting by date rather
          # than by version matters for repos that switched schemes: an
          # abandoned CalVer tag must not outrank the current 4.x line.
          # Prerelease/test tags are excluded by the anchored pattern.
          # New tags are always emitted as plain v<semver>.
          PREV=$(git tag --list --sort=-creatordate \
            | grep -E '^([A-Za-z][A-Za-z0-9_.-]*-)?v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            BASE=$(printf '%s' "$PREV" | sed -E 's/^([A-Za-z][A-Za-z0-9_.-]*-)?v?//')
          else
            RANGE=""
            BASE="0.0.0"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$BASE"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          # \x1f separates fields, \x1e terminates each record, so subjects and
          # bodies containing newlines survive the round trip intact.
          if [ -n "$RANGE" ]; then
            git log --no-merges --format='%h%x1f%s%x1f%b%x1e' "$RANGE" > "$D/commits"
          else
            git log --no-merges --format='%h%x1f%s%x1f%b%x1e' > "$D/commits"
          fi

          HAS_FEAT=0; HAS_BREAKING=0; COUNT=0
          while IFS=$'\x1f' read -r -d $'\x1e' SHA SUBJECT BODY; do
            SHA="${SHA#$'\n'}"
            [ -z "$SHA" ] && continue
            COUNT=$((COUNT + 1))

            if [[ "$SUBJECT" =~ ^([a-zA-Z]+)(\(([^\)]*)\))?(!)?:[[:space:]]*(.*)$ ]]; then
              TYPE=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              SCOPE="${BASH_REMATCH[3]}"
              BANG="${BASH_REMATCH[4]}"
              DESC="${BASH_REMATCH[5]}"
            else
              TYPE="other"; SCOPE=""; BANG=""; DESC="$SUBJECT"
            fi

            IS_BREAKING=0
            [ -n "$BANG" ] && IS_BREAKING=1
            if printf '%s' "$BODY" | grep -qE '^BREAKING[ -]CHANGE'; then
              IS_BREAKING=1
            fi

            if [ -n "$SCOPE" ]; then
              ENTRY="- **${SCOPE}:** ${DESC} (${SHA})"
            else
              ENTRY="- ${DESC} (${SHA})"
            fi

            case "$TYPE" in
              feat|feature) HAS_FEAT=1; echo "$ENTRY" >> "$D/feat" ;;
              fix|bugfix)   echo "$ENTRY" >> "$D/fix" ;;
              perf)         echo "$ENTRY" >> "$D/perf" ;;
              refactor)     echo "$ENTRY" >> "$D/refactor" ;;
              docs)         echo "$ENTRY" >> "$D/docs" ;;
              *)            echo "$ENTRY" >> "$D/misc" ;;
            esac
            [ "$IS_BREAKING" = 1 ] && echo "$ENTRY" >> "$D/breaking"
          done < "$D/commits"

          if [ -n "$VERSION_INPUT" ]; then
            VERSION="${VERSION_INPUT#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
              echo "::error::'$VERSION_INPUT' is not a valid semver version (expected e.g. 1.4.0)"
              exit 1
            fi
          else
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::No commits since ${PREV:-the start of history} — nothing to release."
              exit 1
            fi
            BUMP="$BUMP_INPUT"
            if [ "$BUMP" = "auto" ]; then
              if   [ "$HAS_BREAKING" = 1 ]; then BUMP="major"
              elif [ "$HAS_FEAT" = 1 ];     then BUMP="minor"
              else                               BUMP="patch"
              fi
            fi
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Pass an explicit 'version' input to pick another."
            exit 1
          fi

          {
            if [ -s "$D/breaking" ]; then echo "### ⚠ BREAKING CHANGES"; echo; cat "$D/breaking"; echo; fi
            if [ -s "$D/feat" ];     then echo "### Features";           echo; cat "$D/feat";     echo; fi
            if [ -s "$D/fix" ];      then echo "### Bug Fixes";          echo; cat "$D/fix";      echo; fi
            if [ -s "$D/perf" ];     then echo "### Performance";        echo; cat "$D/perf";     echo; fi
            if [ -s "$D/refactor" ]; then echo "### Refactoring";        echo; cat "$D/refactor"; echo; fi
            if [ -s "$D/docs" ];     then echo "### Documentation";      echo; cat "$D/docs";     echo; fi
            if [ -s "$D/misc" ];     then echo "### Other";              echo; cat "$D/misc";     echo; fi
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > "$D/changelog.md"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "previous_tag=${PREV}"
            echo "changelog<<__CHANGELOG_EOF__"
            cat "$D/changelog.md"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## ${TAG}"
            echo
            echo "Previous tag: \`${PREV:-none}\` · commits analysed: ${COUNT}"
            echo
            cat "$D/changelog.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Shared platform matrix for the desktop + server jobs
  # ============================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          ALL='[
            {"id":"macos-aarch64","runs_on":"macos-latest","target":"aarch64-apple-darwin"},
            {"id":"ubuntu","runs_on":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
            {"id":"ubuntu-arm","runs_on":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"id":"windows","runs_on":"windows-2022","target":"x86_64-pc-windows-msvc"},
            {"id":"windows-arm64","runs_on":"windows-11-arm","target":"aarch64-pc-windows-msvc"}
          ]'
          PLATFORM="${{ github.event.inputs.platform }}"
          if [[ -z "$PLATFORM" || "$PLATFORM" == "all" ]]; then
            INCLUDE="$ALL"
          else
            INCLUDE=$(echo "$ALL" | jq "[.[] | select(.id == \"$PLATFORM\")]")
          fi
          echo "matrix=$(echo "$INCLUDE" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Desktop app (Tauri) — installers + signed updater artifacts
  # ============================================================
  desktop:
    needs: [version, setup]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies (ubuntu only)
        if: startsWith(matrix.runs_on, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: install web dependencies
        working-directory: web
        run: npm ci

      - name: install desktop (tauri-cli) dependencies
        working-directory: desktop
        run: npm install

      # The edits live only in the runner workspace — they are never committed
      # back to the repo.
      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v' desktop/src-tauri/tauri.conf.json > conf.tmp
          mv conf.tmp desktop/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' desktop/package.json > pkg.tmp
          mv pkg.tmp desktop/package.json
          perl -0pi -e 's/^(\[package\](?:[^\[]*?)\nversion\s*=\s*")[^"]*(")/${1}'"$VERSION"'${2}/ms' desktop/src-tauri/Cargo.toml
          echo "Building version $VERSION"

      - name: build desktop app
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kanva-desktop-${{ matrix.id }}
          # Exclude extracted runtime libs placed in release/ directly by AppImage tools
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # ============================================================
  # Standalone server binary — for self-hosters who don't want Docker
  # ============================================================
  server:
    needs: [version, setup]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'server -> target'

      # The edits live only in the runner workspace — they are never committed
      # back to the repo.
      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/^(\[package\](?:[^\[]*?)\nversion\s*=\s*")[^"]*(")/${1}'"$VERSION"'${2}/ms' server/Cargo.toml
          # Keep Cargo.lock's own package entry in sync — the build below uses
          # --locked, which refuses to run if Cargo.toml and Cargo.lock disagree.
          perl -0pi -e 's/(name = "kanva-server"\nversion = ")[^"]*(")/${1}'"$VERSION"'${2}/' server/Cargo.lock
          echo "Building version $VERSION"

      - name: build kanva-server
        working-directory: server
        run: cargo build --release --locked --target ${{ matrix.target }} --bin kanva-server

      - name: package binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp server/target/${{ matrix.target }}/release/kanva-server dist/
          tar -C dist -czf kanva-server-${{ matrix.target }}.tar.gz kanva-server

      - name: package binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "server/target/${{ matrix.target }}/release/kanva-server.exe" dist/
          Compress-Archive -Path dist/kanva-server.exe -DestinationPath kanva-server-${{ matrix.target }}.zip

      - name: upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kanva-server-${{ matrix.id }}
          path: |
            kanva-server-${{ matrix.target }}.tar.gz
            kanva-server-${{ matrix.target }}.zip

  # ============================================================
  # Web SPA — single, platform-independent build
  # ============================================================
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install dependencies
        working-directory: web
        run: npm ci

      - name: typecheck + build
        working-directory: web
        run: npm run build

      - name: package web dist
        run: zip -r kanva-web.zip web/dist

      - name: upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanva-web-dist
          path: kanva-web.zip

 # ============================================================
  # Docker — Native platform builds (x86_64 & ARM64 hardware)
  # ============================================================
  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: set repo owner (lowercase)
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push server image (by arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/kanva-server:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=kanva-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kanva-server-${{ matrix.arch }}

      - name: build & push web image (by arch)
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/kanva-web:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=kanva-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kanva-web-${{ matrix.arch }}

  # Merge single-arch images into multi-arch tags (`latest` and `${{ github.sha }}`)
  docker-manifest:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: set repo owner (lowercase)
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and push server multi-arch manifest
        run: |
          docker manifest create ghcr.io/${{ env.REPO_OWNER }}/kanva-server:${{ github.sha }} \
            ghcr.io/${{ env.REPO_OWNER }}/kanva-server:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.REPO_OWNER }}/kanva-server:${{ github.sha }}-arm64
          docker manifest push ghcr.io/${{ env.REPO_OWNER }}/kanva-server:${{ github.sha }}

          docker manifest create ghcr.io/${{ env.REPO_OWNER }}/kanva-server:latest \
            ghcr.io/${{ env.REPO_OWNER }}/kanva-server:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.REPO_OWNER }}/kanva-server:${{ github.sha }}-arm64
          docker manifest push ghcr.io/${{ env.REPO_OWNER }}/kanva-server:latest

      - name: create and push web multi-arch manifest
        run: |
          docker manifest create ghcr.io/${{ env.REPO_OWNER }}/kanva-web:${{ github.sha }} \
            ghcr.io/${{ env.REPO_OWNER }}/kanva-web:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.REPO_OWNER }}/kanva-web:${{ github.sha }}-arm64
          docker manifest push ghcr.io/${{ env.REPO_OWNER }}/kanva-web:${{ github.sha }}

          docker manifest create ghcr.io/${{ env.REPO_OWNER }}/kanva-web:latest \
            ghcr.io/${{ env.REPO_OWNER }}/kanva-web:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.REPO_OWNER }}/kanva-web:${{ github.sha }}-arm64
          docker manifest push ghcr.io/${{ env.REPO_OWNER }}/kanva-web:latest

  # ============================================================
  # Mobile — Android (real build) + iOS (best-effort, unsigned)
  # ============================================================
  mobile-android:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'mobile/src-tauri -> target'

      - name: install web dependencies
        working-directory: web
        run: npm ci

      - name: install mobile (tauri-cli) dependencies
        working-directory: mobile
        run: npm install

      - name: NDK env
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: init Android project
        working-directory: mobile
        run: npx tauri android init

      - name: configure release signing (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/src-tauri/gen/android/keystore.jks
          cat >> mobile/src-tauri/gen/android/keystore.properties <<EOF
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=keystore.jks
          EOF

      # The edits live only in the runner workspace — they are never committed
      # back to the repo.
      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v' mobile/src-tauri/tauri.conf.json > conf.tmp
          mv conf.tmp mobile/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' mobile/package.json > pkg.tmp
          mv pkg.tmp mobile/package.json
          perl -0pi -e 's/^(\[package\](?:[^\[]*?)\nversion\s*=\s*")[^"]*(")/${1}'"$VERSION"'${2}/ms' mobile/src-tauri/Cargo.toml
          echo "Building version $VERSION"

      - name: build Android app
        working-directory: mobile
        run: npm run android

      - name: upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: kanva-android
          path: |
            mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  mobile-ios:
    runs-on: macos-latest
    continue-on-error: true # unsigned build — informational until Apple signing secrets exist
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'mobile/src-tauri -> target'

      - name: install web dependencies
        working-directory: web
        run: npm ci

      - name: install mobile (tauri-cli) dependencies
        working-directory: mobile
        run: npm install
        
      - name: init iOS project
        working-directory: mobile
        run: npx tauri ios init
        
      - name: build iOS app (simulator, unsigned)
        working-directory: mobile
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: npm run ios -- --target aarch64-sim

  # ============================================================
  # Unified Release — all artifacts in one release
  # ============================================================
  release:
    needs: [version, desktop, server, web, mobile-android, mobile-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'kanva-*'
          path: artifacts

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: 'Kanva ${{ needs.version.outputs.tag }}'
          draft: true
          prerelease: ${{ inputs.prerelease }}
          body: ${{ needs.version.outputs.changelog }}
          files: artifacts/**/*
