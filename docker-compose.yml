version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanva
      POSTGRES_PASSWORD: kanva_dev_password
      POSTGRES_DB: kanva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanva"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kanva-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: kanva-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kanva:kanva_dev_password@postgres:5432/kanva
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      RUST_LOG: kanva_server=debug,tower_http=debug
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: kanva-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
